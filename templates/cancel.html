
{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Платёж отменён</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{% static 'style.css' %}">
  <style>
    body {
      background-color: #E6ECE5;
      font-family: 'Segoe UI', sans-serif;
      color: #6E7683;
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }
    .page-center {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: calc(100vh - 80px); /* 80px — если у navbar примерно такая высота */
    }
    .container {
      background: white;
      padding: 2.5rem 2rem;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(110, 118, 131, 0.15);
      border: 2px solid #B0B3B9;
      text-align: center;
      max-width: 400px;
      margin: 2rem 0;
    }
    h1 {
      color: #6E7683;
      font-size: 2rem;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  {% include "partials/navbar.html" %}
  <div class="page-center">
    <div class="container">
      <h1>Платёж был отменён</h1>
      <p>Вы можете вернуться и попробовать снова.</p>
    </div>
  </div>
</body>
</html>
