<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Удалить налог</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      background-color: #E6ECE5;
      font-family: 'Segoe UI', sans-serif;
      color: #6E7683;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background: white;
      padding: 2.5rem 2rem;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(110, 118, 131, 0.15);
      border: 2px solid #B0B3B9;
      text-align: center;
      max-width: 400px;
    }
    h1 {
      color: #6E7683;
      font-size: 2rem;
      margin-bottom: 1rem;
    }
    form {
      margin-top: 1.5rem;
    }
    button {
      background: #e04e4e;
      color: white;
      border: none;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1rem;
      width: 100%;
    }
    button:hover {
      background: #a53939;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Удалить налог?</h1>
    <p>Вы уверены, что хотите удалить налог "{{ tax.name }}"?</p>
    <form method="post">
      {% csrf_token %}
      <button type="submit">Удалить</button>
    </form>
  </div>
</body>
</html>
